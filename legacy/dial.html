<title>Horizon Dial</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #e9eef0;
    --panel: #fdfefe;
    --panel-2: #f1f6f7;
    --rule: #ccd9dd;
    --rule-soft: #dde7ea;
    --ink: #0b1417;
    --ink-2: #45585f;
    --ink-3: #778c94;
    --accent: #0e8f84;
    --accent-ink: #0a6a62;
    --accent-soft: rgba(14, 143, 132, 0.13);
    --pos: #0e8f84;
    --neg: #b4542f;
    --good: #0ca30c;
    --warning: #a97706;
    --critical: #d03b3b;
    --needle: #0b1417;
    --shadow: 0 1px 2px rgba(11, 20, 23, 0.06), 0 8px 24px -16px rgba(11, 20, 23, 0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0a1013;
      --panel: #121b20;
      --panel-2: #17242a;
      --rule: #24343b;
      --rule-soft: #1b282e;
      --ink: #e9f1f3;
      --ink-2: #9db3bb;
      --ink-3: #6d848d;
      --accent: #3fd3c6;
      --accent-ink: #7ce7dc;
      --accent-soft: rgba(63, 211, 198, 0.16);
      --pos: #3fd3c6;
      --neg: #e4805f;
      --good: #0ca30c;
      --warning: #fab219;
      --critical: #e06767;
      --needle: #f2f8f9;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 18px 40px -28px rgba(0, 0, 0, 0.9);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0a1013;
    --panel: #121b20;
    --panel-2: #17242a;
    --rule: #24343b;
    --rule-soft: #1b282e;
    --ink: #e9f1f3;
    --ink-2: #9db3bb;
    --ink-3: #6d848d;
    --accent: #3fd3c6;
    --accent-ink: #7ce7dc;
    --accent-soft: rgba(63, 211, 198, 0.16);
    --pos: #3fd3c6;
    --neg: #e4805f;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #e06767;
    --needle: #f2f8f9;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 18px 40px -28px rgba(0, 0, 0, 0.9);
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    max-width: 1060px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 28px 56px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .num { font-family: "Chivo Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0;
  }

  /* masthead */
  .masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
  .wordmark { font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
  .wordmark span { color: var(--ink-3); font-weight: 500; }
  .masthead .spacer { flex: 1; }
  .chip-sample {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-2);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .masthead time { font-size: 13px; color: var(--ink-2); }

  /* readout */
  .readout { display: flex; flex-direction: column; gap: 4px; }
  .readout .target-date {
    margin: 2px 0 0;
    font-size: clamp(1.05rem, 3.4vw, 1.4rem);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .hero {
    margin: 2px 0 0;
    font-size: clamp(2.7rem, 11.5vw, 5.4rem);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.035em;
  }
  .hero.is-short { color: var(--critical); }
  .hero-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
  .verdict {
    align-self: flex-start;
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .verdict .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .verdict[data-state="clear"] { color: var(--good); }
  .verdict[data-state="thin"] { color: var(--warning); }
  .verdict[data-state="short"] { color: var(--critical); }

  /* dial */
  .dial {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chart-wrap { position: relative; touch-action: none; cursor: ew-resize; border-radius: 8px; }
  .chart-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .ghost {
    position: absolute;
    top: 6px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--panel);
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
  }
  .ghost.on { opacity: 1; }
  .dial-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .dial-controls label { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  input[type="date"] {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 5px 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 4px 11px;
    cursor: pointer;
  }
  .chips button:hover { color: var(--ink); border-color: var(--ink-3); }
  .chips button[data-key="dip"] { color: var(--critical); border-color: color-mix(in oklab, var(--critical) 45%, var(--rule)); }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .tile { background: var(--panel); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 3px; }
  .tile .value { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; }
  .tile .value.date { font-size: 21px; }
  .tile .value.neg { color: var(--critical); }
  .tile .note { font-size: 12.5px; color: var(--ink-2); }

  /* what-if */
  .whatif { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px 30px; }
  @media (max-width: 720px) { .whatif { grid-template-columns: 1fr; } }
  .whatif h2, .breakdown h2, .table-view summary { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  .sliders { display: flex; flex-direction: column; gap: 14px; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
  .slider .name { font-size: 13.5px; font-weight: 500; }
  .slider .read { font-size: 13px; color: var(--accent-ink); font-weight: 600; }
  .slider input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .toggles { display: flex; flex-direction: column; gap: 7px; }
  .toggle { display: flex; align-items: center; gap: 9px; font-size: 13.5px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--rule-soft); }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  .toggle .when { color: var(--ink-3); font-size: 12px; }
  .toggle .amt { margin-left: auto; font-size: 13px; font-weight: 600; }
  .toggle input:not(:checked) ~ * { opacity: 0.45; text-decoration: line-through; }
  .amt.pos { color: var(--pos); }
  .amt.neg { color: var(--neg); }

  /* breakdown */
  .breakdown { display: flex; flex-direction: column; gap: 10px; }
  .totals { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--ink-2); }
  .totals b { color: var(--ink); font-weight: 600; }
  .mv-list { display: flex; flex-direction: column; gap: 1px; list-style: none; margin: 0; padding: 0; }
  .mv {
    display: grid;
    grid-template-columns: 96px minmax(0, 1fr) 48px 104px;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 13.5px;
  }
  @media (max-width: 520px) { .mv { grid-template-columns: 56px minmax(0, 1fr) 96px; } .mv .count { display: none; } }
  .mv .track { height: 7px; border-radius: 4px; background: var(--rule-soft); overflow: hidden; }
  .mv .track i { display: block; height: 100%; border-radius: 4px; }
  .mv .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mv .count { color: var(--ink-3); font-size: 12px; text-align: right; }
  .mv .amount { text-align: right; font-weight: 600; }

  /* table view */
  .table-view { border-top: 1px solid var(--rule); padding-top: 14px; }
  .table-view summary { cursor: pointer; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--ink-3); font-weight: 600; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; }
  tbody tr.under td { color: var(--critical); }
  footer { color: var(--ink-3); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  footer button { font: inherit; font-size: 12.5px; background: none; border: 1px solid var(--rule); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    .hero, .tile .value { transition: color 140ms ease; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <div class="wordmark">Moraview <span>/ Horizon Dial</span></div>
    <div class="spacer"></div>
    <span class="chip-sample">Sample household</span>
    <time id="asOf"></time>
  </header>

  <section class="readout">
    <p class="eyebrow">Projected balance on</p>
    <p class="target-date" id="targetDate">—</p>
    <p class="hero num" id="hero">—</p>
    <p class="hero-sub" id="heroSub"></p>
    <div class="verdict" id="verdict" data-state="clear"><span class="dot"></span><span id="verdictText"></span></div>
  </section>

  <section class="dial">
    <div class="chart-wrap" id="chartWrap" tabindex="0" role="slider" aria-label="Target date on the forecast timeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <svg id="chart" aria-hidden="true"></svg>
      <div class="ghost" id="ghost"></div>
    </div>
    <div class="dial-controls">
      <label for="dateInput">Jump to</label>
      <input type="date" id="dateInput">
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="whatif">
    <div>
      <h2>Turn the dials</h2>
      <div class="sliders" id="sliders"></div>
    </div>
    <div>
      <h2>Planned one-offs</h2>
      <div class="toggles" id="toggles"></div>
    </div>
  </section>

  <section class="breakdown">
    <h2 id="breakdownHead">Between today and the needle</h2>
    <div class="totals" id="totals"></div>
    <ul class="mv-list" id="mvList"></ul>
  </section>

  <details class="table-view">
    <summary>Month by month, as a table</summary>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Month</th><th>In</th><th>Out</th><th>Net</th><th>Lowest</th><th>Ends at</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </details>

  <footer>
    <span>Figures are an example household, not your accounts. Everything you change stays in this browser.</span>
    <button type="button" id="reset">Reset the dials</button>
  </footer>
</div>

<!-- inline:scenario.js -->
<script>
(function () {
  var KEY = 'moraview.dial.v1';
  var GROUPS = {
    income: { label: 'Everything coming in', categories: ['salary', 'benefit'], min: 0.6, max: 1.3 },
    living: { label: 'Groceries and living', categories: ['living'], min: 0.6, max: 1.4 },
    saving: { label: 'Money moved to savings', categories: ['saving'], min: 0, max: 2 }
  };

  var state = {
    target: '2027-03-02',
    factors: { income: 1, living: 1, saving: 1 },
    off: {}
  };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.target) {
      state.target = saved.target;
      state.off = saved.off || {};
      state.factors = Object.assign(state.factors, saved.factors || {});
    }
  } catch (e) { /* private window, or storage blocked — sample data is fine */ }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function factorFor(category) {
    for (var key in GROUPS) {
      if (GROUPS[key].categories.indexOf(category) > -1) return state.factors[key];
    }
    return 1;
  }
  function tuned() {
    function apply(line) {
      return Object.assign({}, line, { factor: factorFor(line.category), off: !!state.off[line.id] });
    }
    return Object.assign({}, SCENARIO, {
      recurring: SCENARIO.recurring.map(apply),
      planned: SCENARIO.planned.map(apply)
    });
  }

  var el = function (id) { return document.getElementById(id); };
  var wrap = el('chartWrap'), chart = el('chart'), ghost = el('ghost');
  var fc, index;

  /* ---------- chart ---------- */
  function niceTicks(lo, hi) {
    var raw = (hi - lo) / 4;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; })
      .find(function (s) { return s >= raw; }) || 10 * mag;
    var out = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
    return out;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function draw() {
    var days = fc.days;
    var w = Math.max(wrap.clientWidth || 640, 320), h = w < 560 ? 210 : 268;
    var pad = { l: w < 560 ? 46 : 62, r: 12, t: 22, b: 30 };
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

    var lo = Math.min(0, fc.low.balance), hi = days[0].balance;
    days.forEach(function (d) { if (d.balance > hi) hi = d.balance; });
    var span = (hi - lo) || 1;
    lo -= span * 0.10; hi += span * 0.10;

    var X = function (i) { return pad.l + (i / (days.length - 1)) * iw; };
    var Y = function (v) { return pad.t + (1 - (v - lo) / (hi - lo)) * ih; };

    var step = Math.max(1, Math.ceil(days.length / iw));
    var pts = [];
    for (var i = 0; i < days.length; i += step) pts.push([X(i), Y(days[i].balance), i]);
    if (pts[pts.length - 1][2] !== days.length - 1) {
      pts.push([X(days.length - 1), Y(days[days.length - 1].balance), days.length - 1]);
    }
    var line = pts.map(function (p, k) { return (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var base = Y(Math.max(lo, 0));
    var area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + base.toFixed(1) + ' L' + pts[0][0].toFixed(1) + ' ' + base.toFixed(1) + ' Z';

    /* stretches under the buffer, drawn between the balance and the buffer line */
    var bufferY = Y(fc.buffer), shortfalls = [], run = null;
    pts.forEach(function (p) {
      var under = days[p[2]].balance < fc.buffer;
      if (under && !run) run = [p];
      else if (under) run.push(p);
      else if (run) { shortfalls.push(run); run = null; }
    });
    if (run) shortfalls.push(run);
    var shortPaths = shortfalls.map(function (r) {
      var top = r.map(function (p, k) { return (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      return top + ' L' + r[r.length - 1][0].toFixed(1) + ' ' + bufferY.toFixed(1) +
             ' L' + r[0][0].toFixed(1) + ' ' + bufferY.toFixed(1) + ' Z';
    });

    var ticks = niceTicks(lo, hi).map(function (v) {
      return '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) +
             '" stroke="var(--rule-soft)" stroke-width="1"/>' +
             '<text x="' + (pad.l - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" class="num" font-size="10.5" fill="var(--ink-3)">' +
             (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'k</text>';
    }).join('');

    var months = '', prev = '';
    days.forEach(function (d, i) {
      var key = d.date.slice(0, 7);
      if (key === prev) return;
      prev = key;
      var everyN = w < 560 ? 6 : (w < 820 ? 3 : 2);
      var n = Number(key.slice(5)) - 1;
      months += '<line x1="' + X(i).toFixed(1) + '" x2="' + X(i).toFixed(1) + '" y1="' + (h - pad.b) + '" y2="' + (h - pad.b + 4) +
                '" stroke="var(--rule)" stroke-width="1"/>';
      if (n % everyN === 0) {
        months += '<text x="' + X(i).toFixed(1) + '" y="' + (h - pad.b + 17) + '" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">' +
                  esc(MV.monthLabel(key)) + '</text>';
      }
    });

    var flags = (SCENARIO.planned || []).filter(function (p) { return !state.off[p.id] && index[p.date]; })
      .map(function (p) {
        var x = X(days.indexOf(index[p.date])).toFixed(1), y = Y(index[p.date].balance).toFixed(1);
        return '<circle cx="' + x + '" cy="' + y + '" r="3.4" fill="var(--panel)" stroke="' +
               (p.amount >= 0 ? 'var(--pos)' : 'var(--neg)') + '" stroke-width="2"><title>' +
               esc(p.label) + ' — ' + MV.signed(p.amount) + ' on ' + MV.longDate(p.date) + '</title></circle>';
      }).join('');

    var ti = days.indexOf(index[state.target]);
    var nx = X(ti), ny = Y(index[state.target].balance);
    var lowX = X(days.indexOf(fc.low));

    chart.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    chart.setAttribute('height', h);
    chart.innerHTML =
      '<defs><linearGradient id="dialFill" x1="0" x2="0" y1="0" y2="1">' +
      '<stop offset="0" stop-color="var(--accent)" stop-opacity="0.30"/>' +
      '<stop offset="1" stop-color="var(--accent)" stop-opacity="0.02"/></linearGradient></defs>' +
      ticks + months +
      '<path d="' + area + '" fill="url(#dialFill)"/>' +
      shortPaths.map(function (d) { return '<path d="' + d + '" fill="var(--critical)" fill-opacity="0.22"/>'; }).join('') +
      '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + bufferY.toFixed(1) + '" y2="' + bufferY.toFixed(1) +
      '" stroke="var(--warning)" stroke-width="1.5" stroke-dasharray="2 4"/>' +
      '<text x="' + (w - pad.r) + '" y="' + (bufferY - 6).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="var(--warning)">buffer ' +
      MV.money(fc.buffer, { cents: false }) + '</text>' +
      (lo < 0 ? '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) +
        '" stroke="var(--ink-3)" stroke-width="1"/>' : '') +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' +
      '<circle cx="' + lowX.toFixed(1) + '" cy="' + Y(fc.low.balance).toFixed(1) + '" r="4" fill="var(--critical)">' +
      '<title>Lowest point: ' + MV.money(fc.low.balance) + ' on ' + MV.longDate(fc.low.date) + '</title></circle>' +
      '<text x="' + Math.min(lowX + 9, w - pad.r - 4).toFixed(1) + '" y="' + (Y(fc.low.balance) + 15).toFixed(1) +
      '" font-size="10.5" fill="var(--critical)" text-anchor="' + (lowX > w * 0.8 ? 'end' : 'start') + '">lowest ' +
      MV.money(fc.low.balance, { cents: false }) + '</text>' +
      flags +
      '<line x1="' + nx.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y1="' + pad.t + '" y2="' + (h - pad.b) +
      '" stroke="var(--needle)" stroke-width="1.5"/>' +
      '<circle cx="' + nx.toFixed(1) + '" cy="' + ny.toFixed(1) + '" r="6.5" fill="var(--needle)"/>' +
      '<circle cx="' + nx.toFixed(1) + '" cy="' + ny.toFixed(1) + '" r="11" fill="none" stroke="var(--needle)" stroke-opacity="0.28" stroke-width="1.5"/>';

    wrap._geo = { X: X, pad: pad, iw: iw, w: w };
  }

  /* ---------- panels ---------- */
  function tiles() {
    var rhythm = MV.monthlyNet(tuned());
    var first = fc.breach;
    el('tiles').innerHTML = [
      { eyebrow: 'Lowest point ahead',
        value: MV.money(fc.low.balance),
        neg: fc.low.balance < 0,
        note: MV.longDate(fc.low.date) + ' · ' + MV.distance(fc.asOf, fc.low.date) },
      { eyebrow: 'Monthly rhythm',
        value: MV.signed(rhythm.net, { cents: false }),
        neg: rhythm.net < 0,
        note: MV.money(rhythm.inflow, { cents: false }) + ' in, ' + MV.money(-rhythm.outflow, { cents: false }) + ' out, on average' },
      { eyebrow: 'First day under the buffer',
        value: first ? MV.shortDate(first.date) : 'Never',
        neg: !!first, date: true,
        note: first ? MV.distance(fc.asOf, first.date) + ' from today' : 'The buffer of ' + MV.money(fc.buffer, { cents: false }) + ' holds all the way out' }
    ].map(function (t) {
      return '<div class="tile"><p class="eyebrow">' + t.eyebrow + '</p>' +
        '<p class="value num' + (t.neg ? ' neg' : '') + (t.date ? ' date' : '') + '">' + t.value + '</p>' +
        '<p class="note">' + esc(t.note) + '</p></div>';
    }).join('');
  }

  function readout() {
    var day = index[state.target];
    var hero = el('hero');
    hero.textContent = MV.money(day.balance);
    hero.classList.toggle('is-short', day.balance < 0);
    el('targetDate').textContent = MV.longDate(state.target);
    el('heroSub').textContent = MV.distance(fc.asOf, state.target) + ' from today · started from ' +
      MV.money(fc.opening) + ' across two current accounts';

    var v = el('verdict'), text;
    if (day.balance < 0) { v.dataset.state = 'short'; text = 'Short by ' + MV.money(-day.balance) + ' on that day'; }
    else if (day.balance < fc.buffer) { v.dataset.state = 'thin'; text = 'Under your ' + MV.money(fc.buffer, { cents: false }) + ' buffer'; }
    else { v.dataset.state = 'clear'; text = MV.money(day.balance - fc.buffer, { cents: false }) + ' clear of your buffer'; }
    el('verdictText').textContent = text;

    wrap.setAttribute('aria-valuemax', String(fc.days.length - 1));
    wrap.setAttribute('aria-valuenow', String(fc.days.indexOf(day)));
    wrap.setAttribute('aria-valuetext', MV.longDate(state.target) + ': ' + MV.money(day.balance));
    el('dateInput').value = state.target;
  }

  function breakdown() {
    var mv = MV.movements(fc, fc.asOf, state.target);
    el('breakdownHead').textContent = 'What moves between today and ' + MV.longDate(state.target).replace(/^\w+, /, '');
    el('totals').innerHTML =
      '<span>In <b class="num">' + MV.money(mv.inflow) + '</b></span>' +
      '<span>Out <b class="num">' + MV.money(mv.outflow) + '</b></span>' +
      '<span>Net <b class="num">' + MV.signed(mv.total) + '</b></span>';
    var max = mv.lines.reduce(function (m, l) { return Math.max(m, Math.abs(l.amount)); }, 1);
    el('mvList').innerHTML = mv.lines.map(function (l) {
      var pct = (Math.abs(l.amount) / max) * 100;
      return '<li class="mv"><span class="track"><i style="width:' + Math.max(pct, 4).toFixed(1) + '%;background:' +
        (l.amount >= 0 ? 'var(--pos)' : 'var(--neg)') + '"></i></span>' +
        '<span class="label">' + esc(l.label) + (l.planned ? ' · planned' : '') + '</span>' +
        '<span class="count">' + (l.count > 1 ? '×' + l.count : '') + '</span>' +
        '<span class="amount num ' + (l.amount >= 0 ? 'pos' : 'neg') + '">' + MV.signed(l.amount) + '</span></li>';
    }).join('');
  }

  function table() {
    el('tableBody').innerHTML = MV.byMonth(fc).map(function (m) {
      return '<tr class="' + (m.low < fc.buffer ? 'under' : '') + '"><td>' + MV.monthLabel(m.month) + '</td>' +
        '<td class="num">' + MV.money(m.inflow, { cents: false }) + '</td>' +
        '<td class="num">' + MV.money(m.outflow, { cents: false }) + '</td>' +
        '<td class="num">' + MV.signed(m.net, { cents: false }) + '</td>' +
        '<td class="num">' + MV.money(m.low, { cents: false }) + '</td>' +
        '<td class="num">' + MV.money(m.end, { cents: false }) + '</td></tr>';
    }).join('');
  }

  function controls() {
    el('sliders').innerHTML = Object.keys(GROUPS).map(function (key) {
      var g = GROUPS[key];
      return '<div class="slider"><span class="name">' + g.label + '</span>' +
        '<span class="read" id="read-' + key + '"></span>' +
        '<input type="range" id="slider-' + key + '" min="' + g.min * 100 + '" max="' + g.max * 100 +
        '" step="5" value="' + Math.round(state.factors[key] * 100) + '" aria-label="' + g.label + '"></div>';
    }).join('');
    Object.keys(GROUPS).forEach(function (key) {
      var input = el('slider-' + key);
      input.addEventListener('input', function () {
        state.factors[key] = Number(input.value) / 100;
        persist(); recompute();
      });
    });

    el('toggles').innerHTML = SCENARIO.planned.map(function (p) {
      return '<label class="toggle" for="plan-' + p.id + '">' +
        '<input type="checkbox" id="plan-' + p.id + '"' + (state.off[p.id] ? '' : ' checked') + '>' +
        '<span>' + esc(p.label) + '</span>' +
        '<span class="when">' + MV.monthLabel(p.date.slice(0, 7)) + '</span>' +
        '<span class="amt num ' + (p.amount >= 0 ? 'pos' : 'neg') + '">' + MV.signed(p.amount, { cents: false }) + '</span></label>';
    }).join('');
    SCENARIO.planned.forEach(function (p) {
      el('plan-' + p.id).addEventListener('change', function (e) {
        if (e.target.checked) delete state.off[p.id]; else state.off[p.id] = true;
        persist(); recompute();
      });
    });
  }

  function sliderReadouts() {
    Object.keys(GROUPS).forEach(function (key) {
      var f = state.factors[key], read = el('read-' + key);
      if (!read) return;
      read.textContent = f === 1 ? 'as it is' : (f > 1 ? '+' : '') + Math.round((f - 1) * 100) + '%';
    });
  }

  function chipRow() {
    var opts = [
      { key: 'm1', label: 'in a month', date: MV.iso(MV.addMonths(MV.parseDate(fc.asOf), 1)) },
      { key: 'm6', label: 'in 6 months', date: MV.iso(MV.addMonths(MV.parseDate(fc.asOf), 6)) },
      { key: 'ye', label: 'new year', date: '2027-01-01' },
      { key: 'dip', label: 'the lowest point', date: fc.low.date },
      { key: 'end', label: 'end of horizon', date: fc.days[fc.days.length - 1].date }
    ];
    el('chips').innerHTML = opts.map(function (o) {
      return '<button type="button" data-key="' + o.key + '" data-date="' + o.date + '">' + o.label + '</button>';
    }).join('');
    Array.prototype.forEach.call(el('chips').children, function (b) {
      b.addEventListener('click', function () { setTarget(b.dataset.date); });
    });
  }

  /* ---------- interaction ---------- */
  function setTarget(date) {
    if (!index[date]) {
      date = date < fc.asOf ? fc.asOf : fc.days[fc.days.length - 1].date;
    }
    state.target = date;
    persist();
    readout(); breakdown(); draw();
  }
  function dateFromX(clientX) {
    var geo = wrap._geo, box = wrap.getBoundingClientRect();
    var scale = box.width / geo.w;
    var t = (clientX - box.left - geo.pad.l * scale) / (geo.iw * scale);
    var i = Math.round(Math.min(1, Math.max(0, t)) * (fc.days.length - 1));
    return fc.days[i].date;
  }

  var dragging = false;
  wrap.addEventListener('pointerdown', function (e) {
    dragging = true;
    wrap.setPointerCapture(e.pointerId);
    ghost.classList.remove('on');
    setTarget(dateFromX(e.clientX));
  });
  wrap.addEventListener('pointermove', function (e) {
    if (dragging) { setTarget(dateFromX(e.clientX)); return; }
    var date = dateFromX(e.clientX), box = wrap.getBoundingClientRect();
    ghost.classList.add('on');
    ghost.style.left = (e.clientX - box.left) + 'px';
    ghost.textContent = MV.monthLabel(date.slice(0, 7)) + ' ' + Number(date.slice(8)) + ' · ' + MV.money(index[date].balance, { cents: false });
  });
  wrap.addEventListener('pointerup', function () { dragging = false; });
  wrap.addEventListener('pointerleave', function () { ghost.classList.remove('on'); });
  wrap.addEventListener('keydown', function (e) {
    var jump = { ArrowLeft: -1, ArrowRight: 1, PageUp: 30, PageDown: -30 }[e.key];
    if (jump === undefined && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    var i = fc.days.indexOf(index[state.target]);
    if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = fc.days.length - 1;
    else i = Math.min(fc.days.length - 1, Math.max(0, i + jump * (e.shiftKey ? 30 : 1)));
    setTarget(fc.days[i].date);
  });
  el('dateInput').addEventListener('change', function (e) { setTarget(e.target.value); });
  el('reset').addEventListener('click', function () {
    state = { target: '2027-03-02', factors: { income: 1, living: 1, saving: 1 }, off: {} };
    persist(); controls(); recompute();
  });

  /* ---------- run ---------- */
  function recompute() {
    fc = MV.project(tuned());
    index = fc.index;
    if (!index[state.target]) state.target = fc.days[Math.min(fc.days.length - 1, 173)].date;
    readout(); tiles(); breakdown(); table(); sliderReadouts(); draw();
  }

  el('asOf').textContent = 'Today: ' + MV.longDate(SCENARIO.asOf).replace(/^\w+, /, '');
  el('asOf').setAttribute('datetime', SCENARIO.asOf);
  controls();
  fc = MV.project(tuned());
  index = fc.index;
  chipRow();
  recompute();
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(wrap);
  else window.addEventListener('resize', draw);
})();
</script>
